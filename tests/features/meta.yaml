
{% set build = 0 %}

package:
  name: "cuda-archs-test-package"
  version: "2.0.0"

build:
  number: {{ build + priority | int * 100 }}

env:
  - CUDAARCHS={{ CUDAARCHS }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('cuda') }}
    - {{ stdlib('c') }}
  host:
    - cuda-arch {{ cuda_arch_version }}

test:
  requires:
    # pin cuda-arch at test time, to check for installability
    - cuda-arch {{ cuda_arch_version }}
  commands:
    - hello.sh
