CUDAARCHS:
  - "86-real;86-virtual"
  - "80-real;80-virtual"
  - "50-real;60-real;70-real;70-virtual"

cuda_arch_version:
  - 8.6
  - 8.0
  - 5.0

priority:
  - 2
  - 1
  - 0

zip_keys:
  - cuda_arch_version
